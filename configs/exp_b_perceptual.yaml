# W5 experiment B (additive): baseline_train100 + HuBERT perceptual loss.
#
# The only differences from baseline_train100.yaml are the new
# loss.perceptual* fields and the dedicated out_dir / run_name. All other
# hyperparameters are held fixed so the comparison is clean.

data:
  root: datasets
  split: train-clean-100
  sample_rate: 16000
  segment_seconds: 1.0
  batch_size: 16
  num_workers: 8

model:
  encoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  decoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  quantizer:
    num_quantizers: 4
    codebook_size: 1024
    decay: 0.99
    dead_code_steps: 20
    dead_code_threshold: 0.01

loss:
  l1_weight: 0.1
  stft_weight: 1.0
  commitment_weight: 1.0
  perceptual_weight: 1.0       # new — additive perceptual term
  perceptual:
    layer: 6                   # HuBERT base layer 6 (phonetic mid-layer)
  stft:
    window_sizes: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64

optim:
  lr: 3.0e-4
  betas: [0.9, 0.99]

train:
  total_steps: 50000
  log_every: 100
  ckpt_every: 5000
  out_dir: outputs/exp_b_perceptual
  seed: 0

logger:
  type: tensorboard

  wandb:
    project: mini-codec
    entity: rmaa0045-monash-university
    run_name: exp_b_perceptual_l6
