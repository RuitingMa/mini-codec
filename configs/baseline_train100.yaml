# Production baseline config: trains on LibriSpeech train-clean-100 (~100h
# of clean speech, ~28k utterances). The dev-clean version of this config
# (configs/baseline.yaml) was a pipeline smoke test — its checkpoints are
# NOT reportable. Numbers in the technical report come from a checkpoint
# trained with this config and evaluated on test-clean exactly once.
#
# Differences from baseline.yaml:
#   - data.split: train-clean-100  (10x more data)
#   - data.num_workers: 8          (Linux is fine here; CPU has plenty)
#   - train.log_every: 100         (less stdout spam over a 50k run)
#   - train.ckpt_every: 5000       (10 ckpts per run instead of 500)

data:
  root: datasets
  split: train-clean-100
  sample_rate: 16000
  segment_seconds: 1.0
  batch_size: 16
  num_workers: 8

model:
  encoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  decoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  quantizer:
    num_quantizers: 4
    codebook_size: 1024
    decay: 0.99
    dead_code_steps: 20
    dead_code_threshold: 0.01

loss:
  l1_weight: 0.1
  stft_weight: 1.0
  commitment_weight: 1.0
  stft:
    window_sizes: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64

optim:
  lr: 3.0e-4
  betas: [0.9, 0.99]

train:
  total_steps: 50000
  log_every: 100
  ckpt_every: 5000
  out_dir: outputs/baseline_train100
  seed: 0

logger:
  type: tensorboard

  wandb:
    project: mini-codec
    entity: rmaa0045-monash-university
    run_name: null
