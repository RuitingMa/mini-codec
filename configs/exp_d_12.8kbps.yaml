# W7 experiment D, top of the bitrate scan: 16-layer RVQ -> 12.8 kbps target.
#
# Identical to baseline_train100.yaml except for model.quantizer.num_quantizers
# (4 -> 16) and the per-experiment out_dir / run_name.
#
# bitrate = 16 layers * log2(1024) * 80 Hz frame rate = 12800 bps
# This is the top of the scan and tests whether the encoder + decoder have
# the capacity to take advantage of 4x more bits than the baseline. If
# SI-SDR plateaus by N=8, the encoder/decoder is the bottleneck rather
# than the quantizer.

data:
  root: datasets
  split: train-clean-100
  sample_rate: 16000
  segment_seconds: 1.0
  batch_size: 16
  num_workers: 8

model:
  encoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  decoder:
    base_channels: 32
    strides: [2, 4, 5, 5]
    latent_dim: 128
  quantizer:
    num_quantizers: 16         # 4x baseline
    codebook_size: 1024
    decay: 0.99
    dead_code_steps: 20
    dead_code_threshold: 0.01

loss:
  l1_weight: 0.1
  stft_weight: 1.0
  commitment_weight: 1.0
  stft:
    window_sizes: [64, 128, 256, 512, 1024, 2048]
    n_mels: 64

optim:
  lr: 3.0e-4
  betas: [0.9, 0.99]

train:
  total_steps: 50000
  log_every: 100
  ckpt_every: 5000
  out_dir: outputs/exp_d_12.8kbps
  seed: 0

logger:
  type: tensorboard

  wandb:
    project: mini-codec
    entity: rmaa0045-monash-university
    run_name: exp_d_12.8kbps
